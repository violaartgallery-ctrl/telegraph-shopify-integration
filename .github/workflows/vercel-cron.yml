name: vercel-scheduled-sync

# The watchdog only repairs a broken scheduler chain, and each check wakes Neon.
# Run every 2 hours just after an even-UTC-hour wake (a scheduler slot by day
# and by night in Cairo), so it usually finds Neon already awake. GitHub delays
# :00/:30 schedules the most, so stay a few minutes past the hour.
on:
  schedule:
    - cron: '3 */2 * * *'
  workflow_dispatch:

concurrency:
  group: viola-production-financial-sync
  cancel-in-progress: false

jobs:
  scheduler:
    # This kill switch is outside Neon and Vercel: no paid function is called
    # while emergency receipts await reconciliation. Empty/default stays active.
    if: vars.OPS_AUTOMATION_HOLD != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      primary_healthy: ${{ steps.ensure.outputs.primary_healthy }}
      fallback_allowed: ${{ steps.ensure.outputs.fallback_allowed }}
    steps:
      - name: Watchdog for durable Vercel ops scheduler
        id: ensure
        env:
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
        run: |
          set -euo pipefail
          test -n "$OPS_SECRET"
          response=$(curl --fail-with-body --silent --show-error --retry 2 \
            --connect-timeout 15 --max-time 60 -H "x-ops-secret: $OPS_SECRET" \
            "https://viola-telegraph-integration-ahmed-4a74.vercel.app/ops/scheduler/ensure")
          echo "$response" | jq -c .
          echo "primary_healthy=$(echo "$response" | jq -r '.primaryHealthy // false')" >> "$GITHUB_OUTPUT"
          echo "fallback_allowed=$(echo "$response" | jq -r '.fallbackAllowed // false')" >> "$GITHUB_OUTPUT"

  status-sync:
    needs: [scheduler]
    if: always() && needs.scheduler.result == 'success' && needs.scheduler.outputs.fallback_allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE: https://viola-telegraph-integration-ahmed-4a74.vercel.app
      OPS_SECRET: ${{ secrets.OPS_SECRET }}
    steps:
      - name: Validate scheduler secret
        run: test -n "$OPS_SECRET"

      - name: Keep storefront delivery locations warm
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors \
            --retry-delay 2 --connect-timeout 15 --max-time 95 \
            -X POST -H "x-ops-secret: $OPS_SECRET" "$BASE/ops/refresh-location-catalog"

      - name: Drain Meta Delivered outbox
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --retry-delay 2 --connect-timeout 15 --max-time 95 \
            -X POST -H "x-ops-secret: $OPS_SECRET" "$BASE/ops/meta-delivered/drain"

      - name: Sync open shipments
        if: always()
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --retry-delay 2 --connect-timeout 15 --max-time 95 \
            -H "x-ops-secret: $OPS_SECRET" "$BASE/ops/sync-open-shipments"

      - name: Discover collections from hot page and durable cursor
        id: discover_collections
        if: always()
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --retry-delay 2 --connect-timeout 15 --max-time 95 \
            -H "x-ops-secret: $OPS_SECRET" "$BASE/ops/sync-collections?apply=1&pages=2")
          echo "$response" | jq -c '{scanned,carrierCollections,exactMatches,shopifyQueued,odooQueued,alreadyQueued,legacySkipped,failed,recentPages,recentSweepComplete,historicalPages,nextPage,scanComplete,elapsedMs}'

      - name: Discover returns from hot page and durable cursor
        id: discover_returns
        if: always()
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --retry-delay 2 --connect-timeout 15 --max-time 95 \
            -X POST -H "x-ops-secret: $OPS_SECRET" \
            "$BASE/ops/sync-returns?apply=1&pages=2")
          echo "$response" | jq -c '{scanned,carrierReturns,exactMatches,queued,alreadyComplete,legacySkipped,failed,recentPages,recentSweepComplete,historicalPages,nextPage,scanComplete,elapsedMs}'

      - name: Process return actions in resumable batches
        id: process_returns
        if: always()
        run: |
          set -euo pipefail
          for round in $(seq 1 25); do
            response=$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              --retry-delay 2 --connect-timeout 15 --max-time 95 \
              -X POST -H "x-ops-secret: $OPS_SECRET" \
              "$BASE/ops/process-return-queue?apply=1&limit=10")
            echo "$response" | jq -c --arg round "$round" \
              '{round:($round|tonumber),found,processed,skipped,failed,recovered,remaining,hasMore,actions,elapsedMs}'
            found=$(echo "$response" | jq -r '.found // 0')
            has_more=$(echo "$response" | jq -r '.hasMore // false')
            if [ "$has_more" != "true" ] || [ "$found" -eq 0 ]; then
              break
            fi
          done

      - name: Process Shopify payment actions in resumable batches
        id: process_shopify_payments
        if: always()
        run: |
          set -euo pipefail
          for round in $(seq 1 100); do
            response=$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              --retry-delay 2 --connect-timeout 15 --max-time 95 \
              -X POST -H "x-ops-secret: $OPS_SECRET" \
              "$BASE/ops/process-shopify-payment-queue?apply=1&limit=12")
            echo "$response" | jq -c --arg round "$round" \
              '{round:($round|tonumber),found,processed,skipped,failed,recovered,remaining,hasMore,actions,elapsedMs}'
            found=$(echo "$response" | jq -r '.found // 0')
            has_more=$(echo "$response" | jq -r '.hasMore // false')
            if [ "$has_more" != "true" ] || [ "$found" -eq 0 ]; then
              break
            fi
          done

      - name: Resume interrupted production batches
        if: always()
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --retry-delay 2 --connect-timeout 15 --max-time 60 \
            -H "x-ops-secret: $OPS_SECRET" "$BASE/ops/resume-production-jobs"

  odoo-queue:
    if: always() && needs.scheduler.result == 'success' && needs.scheduler.outputs.fallback_allowed == 'true' && needs.status-sync.result == 'success'
    needs: [scheduler, status-sync]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE: https://viola-telegraph-integration-ahmed-4a74.vercel.app
      OPS_SECRET: ${{ secrets.OPS_SECRET }}
    steps:
      - name: Drain Odoo in short checkpoints
        run: |
          set -euo pipefail
          test -n "$OPS_SECRET"
          for round in $(seq 1 25); do
            response=$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              --retry-delay 2 --connect-timeout 15 --max-time 95 \
              -X POST -H "x-ops-secret: $OPS_SECRET" \
              "$BASE/ops/process-odoo-queue")
            echo "$response" | jq -c --arg round "$round" \
              '{round:($round|tonumber),processed,budgetHit,remaining,hasMore,elapsedMs}'
            processed=$(echo "$response" | jq -r '.processed // 0')
            has_more=$(echo "$response" | jq -r '.hasMore // false')
            if [ "$has_more" != "true" ] || [ "$processed" -eq 0 ]; then
              break
            fi
          done

      - name: Process Odoo collection accounting independently
        if: always()
        run: |
          set -euo pipefail
          for round in $(seq 1 100); do
            response=$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              --retry-delay 2 --connect-timeout 15 --max-time 95 \
              -X POST -H "x-ops-secret: $OPS_SECRET" \
              "$BASE/ops/process-odoo-collection-queue?apply=1&limit=20")
            echo "$response" | jq -c --arg round "$round" \
              '{round:($round|tonumber),found,processed,skipped,failed,recovered,remaining,hasMore,actions,elapsedMs}'
            found=$(echo "$response" | jq -r '.found // 0')
            has_more=$(echo "$response" | jq -r '.hasMore // false')
            if [ "$has_more" != "true" ] || [ "$found" -eq 0 ]; then
              break
            fi
          done

  health:
    if: always() && needs.scheduler.result == 'success' && needs.scheduler.outputs.primary_healthy == 'true'
    needs: [scheduler, status-sync, odoo-queue]
    runs-on: ubuntu-latest
    env:
      BASE: https://viola-telegraph-integration-ahmed-4a74.vercel.app
      OPS_SECRET: ${{ secrets.OPS_SECRET }}
    steps:
      - name: Check production safety layers
        run: |
          set -euo pipefail
          test -n "$OPS_SECRET"
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --retry-delay 2 --connect-timeout 15 --max-time 95 \
            -H "x-ops-secret: $OPS_SECRET" "$BASE/ops/production-health"

      - name: Check financial queue safety
        if: always()
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --retry-delay 2 --connect-timeout 15 --max-time 60 \
            -H "x-ops-secret: $OPS_SECRET" "$BASE/ops/financial-health")
          echo "$response" | jq -c .
          {
            echo "## Financial queue summary"
            echo
            echo "- Status: $(echo "$response" | jq -r '.status')"
            echo "- Backlog: $(echo "$response" | jq -r '.totals.backlog')"
            echo "- Manual review: $(echo "$response" | jq -r '.totals.manualReview')"
            echo "- Stuck: $(echo "$response" | jq -r '.totals.stuck')"
            echo "- Failed: $(echo "$response" | jq -r '.totals.failed')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check shipment status polling health
        if: always()
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --retry-delay 2 --connect-timeout 15 --max-time 60 \
            -H "x-ops-secret: $OPS_SECRET" "$BASE/ops/status-polling-health")
          echo "$response" | jq -c .
          {
            echo "## Shipment status polling"
            echo
            echo "- Active: $(echo "$response" | jq -r '.active')"
            echo "- Quarantined missing: $(echo "$response" | jq -r '.quarantined')"
            echo "- Never attempted: $(echo "$response" | jq -r '.neverAttempted')"
            echo "- Retryable lookup misses: $(echo "$response" | jq -r '.retryableMisses')"
          } >> "$GITHUB_STEP_SUMMARY"
